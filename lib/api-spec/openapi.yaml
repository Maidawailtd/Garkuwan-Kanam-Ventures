openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Garkuwan Kanam & Co Ventures
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product listing operations
  - name: orders
    description: Order and payment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      description: Returns all available products grouped by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [trucks, mining-trucks, drilling-motors]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured/highlighted products
      description: Returns a selection of featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product catalog statistics
      description: Returns counts by category and total inventory summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      description: Initiates an order and returns a Flutterwave payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created with payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/verify:
    post:
      operationId: verifyPayment
      tags: [orders]
      summary: Verify Flutterwave payment
      description: Verifies payment status with Flutterwave after redirect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerification"
      responses:
        "200":
          description: Payment verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Payment verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Product:
      type: object
      required:
        - id
        - name
        - category
        - priceNgn
        - priceUsd
        - description
        - specs
        - inStock
        - featured
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [trucks, mining-trucks, drilling-motors]
        priceNgn:
          type: number
          description: Price in Nigerian Naira
        priceUsd:
          type: number
          description: Price in US Dollars
        description:
          type: string
        specs:
          type: string
          description: Technical specifications summary
        imageUrl:
          type: ["string", "null"]
        inStock:
          type: boolean
        featured:
          type: boolean
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        condition:
          type: string
          enum: [new, used, refurbished]

    ProductStats:
      type: object
      required:
        - totalProducts
        - byCategory
      properties:
        totalProducts:
          type: integer
        byCategory:
          type: object
          properties:
            trucks:
              type: integer
            mining-trucks:
              type: integer
            drilling-motors:
              type: integer

    OrderInput:
      type: object
      required:
        - productId
        - quantity
        - customerName
        - customerEmail
        - customerPhone
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        shippingAddress:
          type: string
        notes:
          type: ["string", "null"]

    OrderCreated:
      type: object
      required:
        - orderId
        - paymentLink
        - txRef
        - totalAmountNgn
      properties:
        orderId:
          type: integer
        paymentLink:
          type: string
          description: Flutterwave hosted payment URL
        txRef:
          type: string
        totalAmountNgn:
          type: number

    Order:
      type: object
      required:
        - id
        - productId
        - productName
        - quantity
        - totalAmountNgn
        - customerName
        - customerEmail
        - customerPhone
        - status
        - paymentStatus
        - createdAt
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        totalAmountNgn:
          type: number
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        shippingAddress:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        txRef:
          type: ["string", "null"]
        flwRef:
          type: ["string", "null"]
        paymentLink:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PaymentVerification:
      type: object
      required:
        - txRef
        - transactionId
      properties:
        txRef:
          type: string
        transactionId:
          type: string
